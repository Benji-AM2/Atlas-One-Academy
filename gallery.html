<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas One Academy | Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- PASTE TOPBAR AND HEADER HERE (Same as index.html) -->

<section id="gallery">
  <div class="wrap">
    <div class="section-head">
      <div class="eyebrow">Life at Atlas One</div>
      <h2>Gallery</h2>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="events">Events</button>
      <button class="filter-btn" data-filter="sports">Sports</button>
      <button class="filter-btn" data-filter="academics">Academics</button>
      <button class="filter-btn" data-filter="facilities">Facilities</button>
      <button class="filter-btn" data-filter="extracurricular">Robotics & Coding</button>
    </div>
    <div class="gallery-grid" id="galleryGrid">
      <div class="g-item" data-cat="events">Speech & Prize Day</div>
      <div class="g-item" data-cat="sports">Inter-House Sports</div>
      <div class="g-item" data-cat="academics">Science Lab</div>
      <div class="g-item" data-cat="facilities">Library</div>
      <div class="g-item" data-cat="extracurricular">Robotics Club</div>
      <div class="g-item" data-cat="extracurricular">Coding Class</div>
      <div class="g-item" data-cat="events">Cultural Day</div>
      <div class="g-item" data-cat="facilities">Playground</div>
    </div>
  </div>
</section>

<!-- PASTE FOOTER HERE -->

<script>
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const f=btn.dataset.filter;
    document.querySelectorAll('.g-item').forEach(item=>{
      item.classList.toggle('hide', f!=='all' && item.dataset.cat!==f);
    });
  });
});
</script>
</body>
</html>
